<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>summit: one step at a time</title>
<style>
:root{
  --text:#fff;
  --text-dim:rgba(255,255,255,.72);
  --text-faint:rgba(255,255,255,.5);
  --glass:rgba(20,22,30,.32);
  --glass-strong:rgba(20,22,30,.55);
  --glass-border:rgba(255,255,255,.18);
  --hover:rgba(255,255,255,.08);
  --active:rgba(255,255,255,.2);
  --accent:#fff;
  --danger:#ff8a8a;
  --radius:18px;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  font-family:var(--font);color:var(--text);background:#1b1e2b;
  overflow:hidden;-webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font:inherit;color:inherit}
body,input,select,button{text-transform:lowercase}
input::placeholder{text-transform:lowercase}
.modal textarea{text-transform:none}
button{cursor:pointer;background:none;border:0}
:focus-visible{outline:2px solid rgba(255,255,255,.7);outline-offset:2px}

/* ---------- Background ---------- */
#scene{position:fixed;inset:0;z-index:0;transition:background 1s ease}
#scene svg{position:absolute;inset:0;width:100%;height:100%}
#scene svg *{transition:fill 1s ease,opacity 1s ease}
#overlay{position:fixed;inset:0;z-index:1;background:linear-gradient(180deg,rgba(0,0,0,.18),rgba(0,0,0,.08) 40%,rgba(0,0,0,.38));pointer-events:none}

/* ---------- Layout ---------- */
#app{position:relative;z-index:2;height:100%;display:flex;flex-direction:column;align-items:center;padding:20px 24px 64px;overflow-y:auto;transition:padding .35s ease}
#hero{display:contents;user-select:none}
#clock{grid-column:2;grid-row:1;user-select:none;font-size:40px;font-weight:300;letter-spacing:-.01em;line-height:1;cursor:pointer;white-space:nowrap;color:rgba(255,255,255,.92);font-variant-numeric:tabular-nums}
#clock .ampm{font-size:.45em;font-weight:400;letter-spacing:.02em;margin-left:.2em;color:var(--text-dim)}
#date{grid-column:1;grid-row:1;justify-self:start;min-width:0;max-width:100%;user-select:none;color:var(--text-dim);font-size:20px;font-weight:400;letter-spacing:.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---------- Card ---------- */
#card{
  width:min(1600px,100%);flex:1;min-height:0;
  background:var(--glass);border:1px solid var(--glass-border);border-radius:var(--radius);
  backdrop-filter:blur(22px) saturate(140%);-webkit-backdrop-filter:blur(22px) saturate(140%);
  box-shadow:0 20px 60px rgba(0,0,0,.25);
  display:flex;flex-direction:column;transition:all .35s ease;
}
body.docked #app{align-items:flex-end}
body.docked #card{width:min(620px,100%)}
@media (max-width:760px){
  body.docked #card{width:100%}
}

.card-head{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;padding:20px 18px 14px 24px}
.head-actions{grid-column:3;justify-self:end;display:flex;gap:4px}
.icon-btn{width:44px;height:44px;border-radius:10px;display:inline-grid;place-items:center;color:var(--text-dim);transition:background .15s,color .15s;flex:none}
.icon-btn:hover{background:var(--hover);color:var(--text)}
.icon-btn svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* pills */
#pills{display:flex;gap:8px;padding:4px 20px 12px;overflow-x:auto;scrollbar-width:none}
#pills::-webkit-scrollbar{display:none}
.pill{flex:none;padding:8px 18px;border-radius:999px;font-size:19px;color:var(--text-dim);background:transparent;border:1px solid transparent;white-space:nowrap;transition:all .15s}
.pill:hover{background:var(--hover);color:var(--text)}
.pill.on{background:var(--active);color:var(--text);border-color:rgba(255,255,255,.15)}
.pill .n{opacity:.6;margin-left:6px;font-size:16px}
.pill.add{color:var(--text-faint);border:1px dashed rgba(255,255,255,.25)}
.pill-input{flex:none;width:170px;padding:8px 14px;border-radius:999px;font-size:19px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.35);outline:none}

/* add */
.add-row{padding:0 20px 8px;position:relative}
#newTask{
  width:100%;padding:16px 20px;border-radius:14px;font-size:22px;
  background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.14);outline:none;transition:all .15s;
}
#newTask::placeholder{color:var(--text-faint)}
#newTask:focus{background:rgba(255,255,255,.16);border-color:rgba(255,255,255,.35)}

/* toolbar */
.toolbar{display:flex;align-items:center;gap:8px;padding:8px 20px 10px;font-size:17px;color:var(--text-dim);flex-wrap:wrap}
.seg{display:inline-flex;background:rgba(0,0,0,.18);border-radius:10px;padding:3px}
.seg button{padding:6px 14px;border-radius:8px;color:var(--text-dim);font-size:17px}
.seg button.on{background:rgba(255,255,255,.2);color:var(--text)}
.toolbar .spacer{flex:1}
.text-btn{padding:6px 12px;border-radius:8px;color:var(--text-dim);font-size:17px}
.text-btn:hover{background:var(--hover);color:var(--text)}

/* list */
#list{list-style:none;margin:0;padding:2px 12px 10px;overflow-y:auto;flex:1;min-height:60px}
.task{
  display:flex;align-items:center;gap:14px;padding:13px 12px 13px 6px;border-radius:12px;
  position:relative;transition:background .12s;outline:none;
}
.task:hover,.task:focus-within,.task:focus{background:var(--hover)}
.task:focus-visible{box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.45)}
.task.dragging{opacity:.35}
.task.drop-before::before,.task.drop-after::after{content:"";position:absolute;left:8px;right:8px;height:2px;background:#fff;border-radius:2px}
.task.drop-before::before{top:-1px}
.task.drop-after::after{bottom:-1px}
.grip{width:18px;color:var(--text-faint);cursor:grab;opacity:0;font-size:16px;letter-spacing:-2px;text-align:center;user-select:none;flex:none}
.task:hover .grip{opacity:1}
.check{appearance:none;-webkit-appearance:none;width:26px;height:26px;border-radius:50%;border:1.8px solid rgba(255,255,255,.65);flex:none;cursor:pointer;display:grid;place-items:center;transition:all .15s;margin:0}
.check:hover{border-color:#fff;background:rgba(255,255,255,.1)}
.check:checked{background:#fff;border-color:#fff}
.check:checked::after{content:"";width:7px;height:13px;border:solid #222;border-width:0 2.4px 2.4px 0;transform:translateY(-1px) rotate(45deg)}
.ttext{flex:1;min-width:0;font-size:22px;line-height:1.35;word-wrap:break-word;overflow-wrap:anywhere;cursor:default}
.task.done .ttext{text-decoration:line-through;text-decoration-color:rgba(255,255,255,.5);color:var(--text-faint)}
.edit-input{flex:1;min-width:0;font-size:22px;padding:4px 10px;margin:-5px 0;border-radius:8px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.4);outline:none}
.badge{flex:none;font-size:15px;padding:3px 10px;border-radius:999px;background:rgba(255,255,255,.14);color:var(--text-dim);white-space:nowrap}
.actions{display:flex;align-items:center;gap:4px;opacity:0;transition:opacity .12s}
.task:hover .actions,.task:focus-within .actions,.task:focus .actions,.task.editing .actions{opacity:1}
.actions .icon-btn{width:36px;height:36px;border-radius:8px}
.actions .icon-btn svg{width:19px;height:19px}
.actions .del:hover{color:var(--danger)}
.catsel{appearance:none;-webkit-appearance:none;font-size:16px;padding:4px 10px;border-radius:8px;background:rgba(0,0,0,.25);border:1px solid rgba(255,255,255,.15);color:var(--text-dim);max-width:160px;cursor:pointer;outline:none}
.catsel option{color:#111;background:#fff}
@media (hover:none){.actions,.grip{opacity:1}}

.empty{padding:32px 12px;text-align:center;color:var(--text-faint);font-size:19px}
.card-foot{display:flex;justify-content:space-between;align-items:center;padding:10px 24px 14px;font-size:15px;color:var(--text-faint);border-top:1px solid rgba(255,255,255,.08)}
kbd{font-family:inherit;font-size:13px;padding:1px 5px;border-radius:4px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.12)}

/* corner controls */
.corner{position:fixed;z-index:3;display:flex;gap:6px;bottom:14px}
.corner.left{left:14px}.corner.right{right:14px}
body.docked .corner.right{display:none}
.corner button{display:flex;align-items:center;gap:7px;padding:7px 12px;border-radius:999px;font-size:15.5px;color:var(--text-dim);background:rgba(0,0,0,.22);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.12)}
.corner button:hover{color:var(--text);background:rgba(0,0,0,.35)}
.corner svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* modal */
.modal-bg{position:fixed;inset:0;z-index:10;background:rgba(0,0,0,.4);display:none;align-items:center;justify-content:center;padding:16px}
.modal-bg.open{display:flex}
.modal{width:min(600px,100%);max-height:calc(100vh - 32px);overflow:auto;background:var(--glass-strong);border:1px solid var(--glass-border);border-radius:var(--radius);backdrop-filter:blur(28px) saturate(140%);-webkit-backdrop-filter:blur(28px) saturate(140%);padding:18px 20px 20px;box-shadow:0 30px 80px rgba(0,0,0,.4)}
.modal h2{margin:0 0 4px;font-size:21.5px;font-weight:600;display:flex;align-items:center;justify-content:space-between}
.modal p{margin:0 0 14px;color:var(--text-dim);font-size:16px}
.modal textarea{width:100%;height:220px;resize:vertical;padding:10px 12px;border-radius:10px;background:rgba(0,0,0,.28);border:1px solid rgba(255,255,255,.15);font:14px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;outline:none}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.btn{padding:8px 14px;border-radius:10px;font-size:16px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.14)}
.btn:hover{background:rgba(255,255,255,.22)}
.btn.primary{background:#fff;color:#1b1e2b;font-weight:600}
.btn.primary:hover{background:rgba(255,255,255,.88)}
.btn.danger{color:var(--danger)}
.cat-row{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.cat-row input{flex:1;padding:8px 12px;border-radius:9px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.15);outline:none}
.cat-row input:focus{border-color:rgba(255,255,255,.4)}
.cat-row .count{font-size:14.5px;color:var(--text-faint);width:56px;text-align:right}

/* toast */
#toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,20px);z-index:20;padding:9px 16px;border-radius:999px;background:rgba(15,16,22,.8);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);font-size:16px;opacity:0;pointer-events:none;transition:all .25s ease}
#toast.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<div id="scene"></div>
<div id="overlay"></div>

<main id="app">
  <section id="card" aria-label="To-do list">
    <div class="card-head">
      <div id="hero">
        <div id="clock" title="click to toggle 12/24-hour"></div>
        <div id="date"></div>
      </div>
      <div class="head-actions">
      <button class="icon-btn" id="copyBtn" title="copy visible tasks as markdown">
        <svg viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/></svg>
      </button>
      <button class="icon-btn" id="catsBtn" title="manage categories">
        <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h10M4 18h7"/><circle cx="18" cy="16" r="2.5"/></svg>
      </button>
      <button class="icon-btn" id="dockBtn" title="dock to side / center">
        <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M15 4v16"/></svg>
      </button>
      </div>
    </div>
    <div id="pills" role="tablist"></div>
    <div class="add-row">
      <input id="newTask" type="text" autocomplete="off" placeholder="Add a task…">
    </div>
    <div class="toolbar">
      <div class="seg" id="statusSeg">
        <button data-s="active">Active</button>
        <button data-s="done">Completed</button>
        <button data-s="all">All</button>
      </div>
      <span class="spacer"></span>
      <button class="text-btn" id="clearDone">Clear completed</button>
    </div>
    <ul id="list"></ul>
    <div class="card-foot">
      <span id="countLabel"></span>
      <span><kbd>⌥</kbd><kbd>↑</kbd><kbd>↓</kbd> reorder · dbl-click to edit</span>
    </div>
  </section>
</main>

<div class="corner left">
  <button id="themeBtn" title="next background">
    <svg viewBox="0 0 24 24"><path d="M3 18l5-7 4 5 3-4 6 6z"/><circle cx="16" cy="7" r="2"/></svg>
    <span id="themeName">Theme</span>
  </button>
  <button id="backupBtn" title="backup / restore">
    <svg viewBox="0 0 24 24"><path d="M12 3v12M7 10l5 5 5-5M4 20h16"/></svg>
    Backup
  </button>
</div>

<!-- Categories modal -->
<div class="modal-bg" id="catsModal">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="catsTitle">
    <h2 id="catsTitle">Categories <button class="icon-btn" data-close><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></h2>
    <p>Rename inline. Deleting a category keeps its tasks — they become uncategorized.</p>
    <div id="catRows"></div>
    <div class="cat-row" style="margin-top:12px">
      <input id="newCat" placeholder="New category name">
      <button class="btn primary" id="addCatBtn">Add</button>
    </div>
  </div>
</div>

<!-- Backup modal -->
<div class="modal-bg" id="backupModal">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="backupTitle">
    <h2 id="backupTitle">Backup &amp; Restore <button class="icon-btn" data-close><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></h2>
    <p>This is all your data. Copy or download it to back up; paste a backup here (or load a file) and click Restore to replace everything.</p>
    <textarea id="backupText" spellcheck="false"></textarea>
    <div class="btn-row">
      <button class="btn" id="bCopy">Copy JSON</button>
      <button class="btn" id="bDownload">Download .json</button>
      <button class="btn" id="bFile">Load file…</button>
      <span style="flex:1"></span>
      <button class="btn primary" id="bRestore">Restore</button>
    </div>
    <input type="file" id="fileInput" accept=".json,application/json" hidden>
  </div>
</div>

<div id="toast" role="status" aria-live="polite"></div>

<script src="app.js"></script>
</body>
